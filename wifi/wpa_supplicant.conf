##### wpa_supplicant configuration - Meizu M6T (M6T / M811H) #####
#
# Minimal template for the MediaTek combo chip. The wpa_supplicant module does
# not ship this file, so the device tree provides it.
update_config=1
ctrl_interface=/data/vendor/wifi/wpa/sockets
driver_param=use_p2p_group_interface=1

device_name=Meizu M6T
manufacturer=Meizu
model_name=M6T
model_number=M811H
serial_number=
device_type=10-0050F204-5
config_methods=physical_display virtual_push_button
p2p_no_group_iface=1
